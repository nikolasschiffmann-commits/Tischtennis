name: Test myTischtennis API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: python -m pip install requests

      - name: Test schedule endpoints
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from urllib.parse import urlsplit

          import requests

          with open("teams.json", encoding="utf-8") as teams_file:
              team_url = json.load(teams_file)["1. Mannschaft"]

          path_parts = urlsplit(team_url).path.strip("/").split("/")
          team_index = path_parts.index("mannschaft")
          team_id = path_parts[team_index + 1]
          season_match = re.search(r"/click-tt/[^/]+/([^/]+)/", urlsplit(team_url).path)
          if season_match is None:
              raise ValueError(f"Saison konnte nicht aus Team-URL gelesen werden: {team_url}")

          loader_route = (
              "routes/click-tt+/$association+/$season+/$type+/"
              "($groupname).gruppe.$urlid_.mannschaft.$teamid.$teamname+/"
              "spielplan.$filter"
          )
          checks = [
              (
                  "Vollständiger Mannschaftsspielplan",
                  team_url,
                  {"_data": loader_route},
              ),
              (
                  "Öffentliche Team-Schedule-API",
                  "https://www.mytischtennis.de/api/ttr/team/schedule",
                  {"teamId": team_id, "season": season_match.group(1)},
              ),
          ]

          full_schedule_available = False
          for name, url, params in checks:
              print(f"\n{name}")
              try:
                  response = requests.get(url, params=params, timeout=20)
              except requests.RequestException as error:
                  print(f"Request fehlgeschlagen: {error}")
                  continue

              print(f"HTTP {response.status_code}; URL: {response.url}")
              print(f"Content-Type: {response.headers.get('content-type', 'unbekannt')}")
              try:
                  payload = response.json()
              except ValueError:
                  print(f"Keine JSON-Antwort: {response.text[:300]}")
                  continue

              data = payload.get("data") if isinstance(payload, dict) else None
              if name == "Vollständiger Mannschaftsspielplan":
                  schedule = data.get("schedule") if isinstance(data, dict) else None
                  if isinstance(schedule, list):
                      full_schedule_available = True
                      print(f"data.schedule vorhanden; Begegnungen: {len(schedule)}")
                      if schedule:
                          print(f"Felder des ersten Spiels: {', '.join(schedule[0].keys())}")
                  else:
                      print("Kein data.schedule-Feld in der Antwort.")
              elif isinstance(data, list):
                  print(f"data-Liste vorhanden; Einträge: {len(data)}")
                  if data:
                      print(f"Felder des ersten Eintrags: {', '.join(data[0].keys())}")
              else:
                  print(f"Unerwartete Antwortstruktur: {str(payload)[:300]}")

          if not full_schedule_available:
              sys.exit("Der vollständige Spielplan-Endpunkt ist nicht nutzbar.")
          PY