name: TT Agent

on:
  # Automatischer Lauf jeden Sonntag
  # 16:00 UTC = 18:00 Uhr Deutschland (Sommerzeit)
  # cron: '0 16 * * 0'

  #schedule:
  #  - cron: '0 16 * * 0'
    
  workflow_dispatch:
    inputs:
      kw:
        description: 'Kalenderwoche'
        required: true
        default: '41'

      jahr:
        description: 'Jahr'
        required: true
        default: '2026'

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests pillow

      - name: Generate Report
        env:
          KW: ${{ github.event.inputs.kw }}
          JAHR: ${{ github.event.inputs.jahr }}
        run: |
          python generate_report.py

      - name: Create Instagram Image
        run: |
          python create_instagram_image.py

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: instagram-image
          path: instagram_post.png

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: instagram-report
          path: instagram_report.txt
