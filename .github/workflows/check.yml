name: TT Agent

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Analysis
        run: |
          python analyze_team.py

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: team-page
          path: team_page.html
