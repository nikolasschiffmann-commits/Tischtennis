<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TT Bot Manager</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:1000px;
            margin:auto;
            padding:30px;
        }

        h1{
            color:#00576e;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
        }

        th{
            background:#00576e;
            color:white;
        }
    </style>
</head>
<body>

<h1>🏓 TT Bot Manager</h1>

<p>Verwaltung der Click-TT Mannschaftslinks</p>

<table id="teamsTable">
    <thead>
        <tr>
            <th>Mannschaft</th>
            <th>Link</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

fetch("teams.json")
.then(response => response.json())
.then(data => {

    const tbody =
        document.querySelector("#teamsTable tbody");

    Object.entries(data).forEach(
        ([team,url]) => {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${team}</td>
                <td>
                    <a href="${url}" target="_blank">
                        Öffnen
                    </a>
                </td>
            `;

            tbody.appendChild(row);
        }
    );
});

</script>

</body>
</html>
