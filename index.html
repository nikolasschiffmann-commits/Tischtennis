<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TT Bot Manager</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:1000px;
            margin:auto;
            padding:30px;
        }

        h1{
            color:#00576e;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
        }

        th{
            background:#00576e;
            color:white;
        }
    </style>
</head>
<body>

<h1>🏓 TT Bot Manager</h1>

<p>Verwaltung der Click-TT Mannschaftslinks</p>

<h2>Kommende Heimspiele</h2>
<div id="homegames"></div>

<h2>Mannschaften</h2>

<table id="teamsTable">
    <thead>
        <tr>
            <th>Mannschaft</th>
            <th>Link</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>

fetch("teams.json")
.then(response => response.json())
.then(data => {

    const tbody =
        document.querySelector("#teamsTable tbody");

    Object.entries(data).forEach(
        ([team,url]) => {

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${team}</td>
                <td>
                    <a href="${url}" target="_blank">
                        Öffnen
                    </a>
                </td>
            `;

            tbody.appendChild(row);
        }
    );
});

fetch("upcoming_homegames.json")
.then(response => response.json())
.then(data => {

    let html = "";

    data.forEach(game => {

        html += `
            <div style="
                border:1px solid #ddd;
                padding:15px;
                margin-bottom:10px;
                border-radius:10px;
                background:#f8f8f8;
            ">

                <h3 style="margin:0;">
                    ${game.mannschaft}
                </h3>

                <p>
                    <strong>${game.gegner}</strong><br>
                    ${game.datum}<br>
                    ${game.uhrzeit} Uhr<br>
                    ${game.ort}
                </p>

            </div>
        `;
    });

    document.getElementById(
        "homegames"
    ).innerHTML = html;
});

</script>

</body>
</html>
