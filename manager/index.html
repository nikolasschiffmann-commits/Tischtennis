<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>TT Bot Manager</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            color: #00576e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #00576e;
            color: white;
        }

    </style>
</head>

<body>

<h1>🏓 TT Bot Manager</h1>

<h2>Mannschaften</h2>

<table id="teamsTable">
    <thead>
        <tr>
            <th>Mannschaft</th>
            <th>Click-TT Link</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>

fetch("../teams.json")
    .then(response => response.json())
    .then(data => {

        const tbody =
            document.querySelector("#teamsTable tbody");

        Object.entries(data).forEach(
            ([team, url]) => {

                const row =
                    document.createElement("tr");
                const teamCell =
                    document.createElement("td");
                const linkCell =
                    document.createElement("td");
                const link =
                    document.createElement("a");

                teamCell.textContent = team;
                link.href = url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "Link öffnen";
                linkCell.appendChild(link);
                row.append(teamCell, linkCell);

                tbody.appendChild(row);
            }
        );
    });

</script>

</body>

</html>
